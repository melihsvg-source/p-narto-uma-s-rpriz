<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senin İçin Özel Bir Sürpriz ❤️</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,600&family=Dancing+Script:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #120309;
            --bg-mid: #2a0815;
            --rose-primary: #ff2a5f;
            --rose-light: #ff7597;
            --gold-accent: #ffd166;
            --cream: #fff5f7;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at 50% 45%, #3d0c1e 0%, #1c040d 55%, #0a0104 100%);
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--cream);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Arka plan kalp yağmuru kanvası */
        #bg-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Ortamdaki romantik ışık parlaması */
        .ambient-glow {
            position: fixed;
            width: 550px;
            height: 550px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 42, 95, 0.18) 0%, rgba(255, 42, 95, 0) 70%);
            filter: blur(40px);
            pointer-events: none;
            z-index: 1;
            animation: pulseGlow 6s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: scale(0.9); opacity: 0.6; }
            100% { transform: scale(1.15); opacity: 1; }
        }

        /* Ana Sahne */
        .stage {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 760px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }

        /* 1. ADIM: İlk Giriş Kartı */
        .intro-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 26px;
            padding: 48px 38px;
            border-radius: 32px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 180, 200, 0.16);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.55), inset 0 1px 1px rgba(255, 255, 255, 0.15);
            max-width: 480px;
            width: 100%;
            transition: all 0.8s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .intro-card.hide {
            opacity: 0;
            transform: scale(0.82) translateY(30px);
            pointer-events: none;
            position: absolute;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 7px 16px;
            border-radius: 999px;
            background: rgba(255, 42, 95, 0.15);
            border: 1px solid rgba(255, 117, 151, 0.3);
            font-size: 0.82rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #ffb3c6;
        }

        .intro-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(2rem, 5vw, 2.75rem);
            font-weight: 700;
            line-height: 1.2;
            color: #ffffff;
            text-shadow: 0 4px 20px rgba(255, 42, 95, 0.35);
        }

        .intro-sub {
            font-size: 1rem;
            line-height: 1.6;
            color: rgba(255, 235, 240, 0.78);
            max-width: 340px;
        }

        /* Aşk Temalı Buton */
        .love-btn {
            position: relative;
            margin-top: 8px;
            padding: 18px 42px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, #ff1e56 0%, #d80048 55%, #a30036 100%);
            border: none;
            border-radius: 999px;
            cursor: pointer;
            box-shadow: 0 10px 35px rgba(255, 30, 86, 0.5), 0 0 0 1px rgba(255, 180, 200, 0.35) inset;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
            overflow: hidden;
        }

        .love-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.35), transparent);
            transition: left 0.6s ease;
        }

        .love-btn:hover {
            transform: translateY(-3px) scale(1.04);
            box-shadow: 0 16px 45px rgba(255, 30, 86, 0.75), 0 0 0 1.5px rgba(255, 210, 225, 0.55) inset;
        }

        .love-btn:hover::before {
            left: 100%;
        }

        .love-btn:active {
            transform: scale(0.97);
        }

        .btn-heart-icon {
            font-size: 1.3rem;
            display: inline-block;
            animation: miniBeat 1.2s infinite ease-in-out;
        }

        @keyframes miniBeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.25); }
        }

        /* 2. & 3. ADIM: Kalp Çıkışı, Ortadan İkiye Ayrılma ve İçinden Çıkan Yazı */
        .surprise-scene {
            position: relative;
            width: 100%;
            height: 520px;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .surprise-scene.active {
            opacity: 1;
            pointer-events: auto;
        }

        .heart-wrapper {
            position: absolute;
            width: 340px;
            height: 340px;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: scale(0);
            z-index: 20;
            pointer-events: none;
        }

        .heart-wrapper.appear {
            animation: heartPopAndBeat 2.1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        @keyframes heartPopAndBeat {
            0% {
                transform: scale(0) rotate(-8deg);
                filter: drop-shadow(0 0 0px rgba(255, 30, 86, 0));
            }
            35% {
                transform: scale(1.12) rotate(0deg);
                filter: drop-shadow(0 0 45px rgba(255, 30, 86, 0.85));
            }
            50% {
                transform: scale(0.95);
            }
            68% {
                transform: scale(1.18);
                filter: drop-shadow(0 0 65px rgba(255, 60, 110, 0.95));
            }
            84% {
                transform: scale(1.02);
            }
            100% {
                transform: scale(1.1);
                filter: drop-shadow(0 0 55px rgba(255, 42, 95, 0.9));
            }
        }

        /* Kalbin sağ ve sol yarıları */
        .heart-half {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            transition: transform 1.6s cubic-bezier(0.16, 1, 0.3, 1), opacity 1.5s ease, filter 1.5s ease;
            will-change: transform, opacity;
        }

        .heart-half svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        /* Sol yarı */
        .heart-left {
            clip-path: polygon(0 0, 50.3% 0, 50.3% 100%, 0 100%);
            transform-origin: 50% 85%;
        }

        /* Sağ yarı */
        .heart-right {
            clip-path: polygon(49.7% 0, 100% 0, 100% 100%, 49.7% 100%);
            transform-origin: 50% 85%;
        }

        /* Kalp ortadan ikiye ayrıldığında uygulanacak efekt */
        .heart-wrapper.split .heart-left {
            transform: translateX(-185px) translateY(15px) rotate(-24deg) scale(0.92);
            filter: drop-shadow(-15px 20px 35px rgba(255, 20, 80, 0.45));
            opacity: 0.35;
        }

        .heart-wrapper.split .heart-right {
            transform: translateX(185px) translateY(15px) rotate(24deg) scale(0.92);
            filter: drop-shadow(15px 20px 35px rgba(255, 20, 80, 0.45));
            opacity: 0.35;
        }

        /* Kalp ayrılırken ortadan çıkan ışık patlaması */
        .center-flash {
            position: absolute;
            width: 6px;
            height: 240px;
            background: linear-gradient(to bottom, transparent, #fff, #ffd166, #ff2a5f, transparent);
            border-radius: 50%;
            filter: blur(4px);
            opacity: 0;
            z-index: 25;
            transform: scaleY(0.2);
        }

        .center-flash.burst {
            animation: seamFlash 1.1s ease-out forwards;
        }

        @keyframes seamFlash {
            0% {
                opacity: 0;
                transform: scaleY(0.2) scaleX(1);
            }
            30% {
                opacity: 1;
                transform: scaleY(1.3) scaleX(8);
                box-shadow: 0 0 60px 25px rgba(255, 220, 230, 0.9);
            }
            100% {
                opacity: 0;
                transform: scaleY(1.8) scaleX(35);
            }
        }

        /* Kalbin İçinden Çıkan Mesaj Kutusu */
        .message-box {
            position: relative;
            z-index: 30;
            max-width: 620px;
            width: 100%;
            padding: 42px 34px;
            border-radius: 32px;
            background: radial-gradient(circle at top, rgba(60, 12, 30, 0.85), rgba(22, 4, 12, 0.92));
            border: 1px solid rgba(255, 190, 210, 0.28);
            box-shadow: 0 25px 75px rgba(0, 0, 0, 0.65), 0 0 60px rgba(255, 42, 95, 0.25);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            opacity: 0;
            transform: scale(0.25) translateY(20px);
            transition: transform 1.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 1.1s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }

        .message-box.emerge {
            opacity: 1;
            transform: scale(1) translateY(0);
        }

        .ring-icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: rgba(255, 209, 102, 0.12);
            border: 1px solid rgba(255, 209, 102, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.9rem;
            box-shadow: 0 0 30px rgba(255, 209, 102, 0.3);
            animation: floatSlow 3s ease-in-out infinite;
        }

        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-7px); }
        }

        .proposal-text {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(2rem, 5.2vw, 3.3rem);
            font-weight: 700;
            font-style: italic;
            line-height: 1.28;
            background: linear-gradient(135deg, #ffffff 0%, #ffe3ec 45%, #ffb3c6 85%, #ffd166 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 8px 32px rgba(255, 42, 95, 0.35);
            letter-spacing: 0.3px;
            padding: 4px 8px;
        }

        .proposal-letter-g {
            display: inline-block;
            font-family: 'Dancing Script', cursive;
            font-size: 1.18em;
            background: linear-gradient(135deg, #ffd166 0%, #ff7597 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 14px rgba(255, 209, 102, 0.55));
            margin-left: 4px;
        }

        .divider-ornament {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 65%;
            opacity: 0.75;
        }

        .divider-ornament span {
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 180, 200, 0.6), transparent);
        }

        /* Cevap Butonları */
        .answer-actions {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            margin-top: 8px;
            flex-wrap: wrap;
            position: relative;
            min-height: 60px;
            width: 100%;
        }

        .btn-yes {
            padding: 15px 40px;
            border-radius: 999px;
            border: none;
            background: linear-gradient(135deg, #ff2a5f 0%, #c9003f 100%);
            color: #fff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(255, 42, 95, 0.55), 0 0 0 1px rgba(255, 210, 225, 0.4) inset;
            transition: all 0.25s ease;
        }

        .btn-yes:hover {
            transform: scale(1.07);
            box-shadow: 0 14px 40px rgba(255, 42, 95, 0.8);
        }

        .btn-no {
            padding: 14px 28px;
            border-radius: 999px;
            border: 1px solid rgba(255, 180, 200, 0.25);
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 230, 238, 0.75);
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.95rem;
            cursor: pointer;
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .celebration-note {
            display: none;
            font-family: 'Dancing Script', cursive;
            font-size: clamp(1.6rem, 4vw, 2.2rem);
            color: #ffd166;
            text-shadow: 0 0 20px rgba(255, 209, 102, 0.5);
            animation: fadeInScale 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Mobil Uyum */
        @media (max-width: 560px) {
            .heart-wrapper {
                width: 260px;
                height: 260px;
            }
            .heart-wrapper.split .heart-left {
                transform: translateX(-115px) translateY(15px) rotate(-22deg) scale(0.85);
            }
            .heart-wrapper.split .heart-right {
                transform: translateX(115px) translateY(15px) rotate(22deg) scale(0.85);
            }
            .message-box {
                padding: 32px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>
    <canvas id="bg-canvas"></canvas>

    <main class="stage">
        <!-- 1. ADIM: İlk Romantik Buton Ekranı -->
        <section class="intro-card" id="introCard">
            <div class="badge">✨ Sana Özel ✨</div>
            <h1 class="intro-title">Kalbimde Saklı Bir Sır Var...</h1>
            <p class="intro-sub">Sadece senin için hazırlanan bu küçük sürprizi açmak için aşağıdaki kalbe dokun.</p>
            <button class="love-btn" id="openHeartBtn">
                <span class="btn-heart-icon">❤️</span>
                <span>Kalbi Açmak İçin Dokun</span>
            </button>
        </section>

        <!-- 2. & 3. ADIM: Kalp Çıkışı, İkiye Ayrılma ve Mesaj -->
        <section class="surprise-scene" id="surpriseScene">
            <div class="center-flash" id="centerFlash"></div>

            <!-- Ortadan İkiye Ayrılan Kalp -->
            <div class="heart-wrapper" id="heartWrapper">
                <!-- Sol Yarı -->
                <div class="heart-half heart-left">
                    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="heartGradLeft" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#ff6b95" />
                                <stop offset="45%" stop-color="#ff1e56" />
                                <stop offset="100%" stop-color="#8f002c" />
                            </linearGradient>
                            <radialGradient id="shineLeft" cx="32%" cy="28%" r="40%">
                                <stop offset="0%" stop-color="rgba(255,255,255,0.65)" />
                                <stop offset="100%" stop-color="rgba(255,255,255,0)" />
                            </radialGradient>
                        </defs>
                        <path d="M100 176 C100 176 22 122 22 65 C22 36 45 16 72 16 C87 16 96 24 100 34 C104 24 113 16 128 16 C155 16 178 36 178 65 C178 122 100 176 100 176 Z" fill="url(#heartGradLeft)" />
                        <path d="M100 176 C100 176 22 122 22 65 C22 36 45 16 72 16 C87 16 96 24 100 34 C104 24 113 16 128 16 C155 16 178 36 178 65 C178 122 100 176 100 176 Z" fill="url(#shineLeft)" />
                    </svg>
                </div>

                <!-- Sağ Yarı -->
                <div class="heart-half heart-right">
                    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="heartGradRight" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#ff6b95" />
                                <stop offset="45%" stop-color="#ff1e56" />
                                <stop offset="100%" stop-color="#8f002c" />
                            </linearGradient>
                        </defs>
                        <path d="M100 176 C100 176 22 122 22 65 C22 36 45 16 72 16 C87 16 96 24 100 34 C104 24 113 16 128 16 C155 16 178 36 178 65 C178 122 100 176 100 176 Z" fill="url(#heartGradRight)" />
                    </svg>
                </div>
            </div>

            <!-- Kalbin İçinden Çıkan Yazı -->
            <div class="message-box" id="messageBox">
                <div class="ring-icon">💍</div>
                <h2 class="proposal-text">
                    benimle bir ömür beraber olur musun <span class="proposal-letter-g">g</span>
                </h2>
                <div class="divider-ornament">
                    <span></span>
                    <small style="color: #ff9ebb; font-size: 1rem;">♥</small>
                    <span></span>
                </div>

                <div class="answer-actions" id="answerActions">
                    <button class="btn-yes" id="yesBtn">Evet, Sonsuza Kadar! ❤️</button>
                    <button class="btn-no" id="noBtn">Hayır</button>
                </div>
                <div class="celebration-note" id="celebrationNote">
                    Seni her şeyden çok seviyorum! İyi ki varsın ❤️✨
                </div>
            </div>
        </section>
    </main>

    <script>
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let burstParticles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class FloatingHeart {
            constructor() {
                this.reset(true);
            }
            reset(initial = false) {
                this.x = Math.random() * canvas.width;
                this.y = initial ? Math.random() * canvas.height : canvas.height + 30;
                this.size = Math.random() * 12 + 6;
                this.speedY = Math.random() * 0.8 + 0.35;
                this.speedX = (Math.random() - 0.5) * 0.5;
                this.opacity = Math.random() * 0.45 + 0.12;
                this.angle = Math.random() * Math.PI * 2;
                this.spin = (Math.random() - 0.5) * 0.015;
                const colors = ['#ff2a5f', '#ff7597', '#ffb3c6', '#ffd166'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }
            update() {
                this.y -= this.speedY;
                this.x += this.speedX + Math.sin(this.angle) * 0.3;
                this.angle += this.spin;
                if (this.y < -30) this.reset(false);
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                const s = this.size;
                ctx.moveTo(0, s * 0.35);
                ctx.bezierCurveTo(0, 0, -s * 0.5, 0, -s * 0.5, s * 0.35);
                ctx.bezierCurveTo(-s * 0.5, s * 0.7, 0, s * 0.95, 0, s * 1.2);
                ctx.bezierCurveTo(0, s * 0.95, s * 0.5, s * 0.7, s * 0.5, s * 0.35);
                ctx.bezierCurveTo(s * 0.5, 0, 0, 0, 0, s * 0.35);
                ctx.fill();
                ctx.restore();
            }
        }

        class SparkleBurst {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 7 + 1.5;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.size = Math.random() * 10 + 4;
                this.alpha = 1;
                this.decay = Math.random() * 0.014 + 0.008;
                const palette = ['#ff2a5f', '#ff8da8', '#ffd166', '#ffffff'];
                this.color = palette[Math.floor(Math.random() * palette.length)];
                this.isHeart = Math.random() > 0.35;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vx *= 0.98;
                this.vy *= 0.98;
                this.vy += 0.04;
                this.alpha -= this.decay;
            }
            draw() {
                if (this.alpha <= 0) return;
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = this.color;
                if (this.isHeart) {
                    const s = this.size;
                    ctx.beginPath();
                    ctx.moveTo(0, s * 0.35);
                    ctx.bezierCurveTo(0, 0, -s * 0.5, 0, -s * 0.5, s * 0.35);
                    ctx.bezierCurveTo(-s * 0.5, s * 0.7, 0, s * 0.95, 0, s * 1.2);
                    ctx.bezierCurveTo(0, s * 0.95, s * 0.5, s * 0.7, s * 0.5, s * 0.35);
                    ctx.bezierCurveTo(s * 0.5, 0, 0, 0, 0, s * 0.35);
                    ctx.fill();
                } else {
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size * 0.3, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        for (let i = 0; i < 42; i++) {
            particles.push(new FloatingHeart());
        }

        function triggerBurst(x, y, count = 80) {
            for (let i = 0; i < count; i++) {
                burstParticles.push(new SparkleBurst(x, y));
            }
        }

        function animateCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            for (let i = burstParticles.length - 1; i >= 0; i--) {
                burstParticles[i].update();
                burstParticles[i].draw();
                if (burstParticles[i].alpha <= 0) {
                    burstParticles.splice(i, 1);
                }
            }
            requestAnimationFrame(animateCanvas);
        }
        animateCanvas();

        // Animasyon Akışı
        const openHeartBtn = document.getElementById('openHeartBtn');
        const introCard = document.getElementById('introCard');
        const surpriseScene = document.getElementById('surpriseScene');
        const heartWrapper = document.getElementById('heartWrapper');
        const centerFlash = document.getElementById('centerFlash');
        const messageBox = document.getElementById('messageBox');
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const answerActions = document.getElementById('answerActions');
        const celebrationNote = document.getElementById('celebrationNote');

        openHeartBtn.addEventListener('click', () => {
            // 1. İlk kartı gizle
            introCard.classList.add('hide');
            surpriseScene.classList.add('active');

            // 2. Büyük kalbi çıkar ve attır
            setTimeout(() => {
                heartWrapper.classList.add('appear');
                triggerBurst(window.innerWidth / 2, window.innerHeight / 2, 40);
            }, 300);

            // 3. Kalbi ortadan ikiye ayır ve içinden yazıyı çıkar
            setTimeout(() => {
                centerFlash.classList.add('burst');
                heartWrapper.classList.add('split');
                triggerBurst(window.innerWidth / 2, window.innerHeight / 2, 110);

                setTimeout(() => {
                    messageBox.classList.add('emerge');
                }, 220);
            }, 2400);
        });

        // Kaçan "Hayır" butonu
        function moveNoButton() {
            const maxX = 160;
            const maxY = 90;
            const randomX = (Math.random() - 0.5) * 2 * maxX;
            const randomY = (Math.random() - 0.5) * 2 * maxY;
            noBtn.style.transform = `translate(${randomX}px, ${randomY}px)`;
        }
        noBtn.addEventListener('mouseenter', moveNoButton);
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            moveNoButton();
        });

        // "Evet" kutlaması
        yesBtn.addEventListener('click', () => {
            answerActions.style.display = 'none';
            celebrationNote.style.display = 'block';
            triggerBurst(window.innerWidth / 2, window.innerHeight / 2, 150);
            setTimeout(() => triggerBurst(window.innerWidth * 0.3, window.innerHeight * 0.4, 80), 400);
            setTimeout(() => triggerBurst(window.innerWidth * 0.7, window.innerHeight * 0.4, 80), 800);
        });
    </script>
</body>
</html>
